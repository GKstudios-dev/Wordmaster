<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Master</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e2a38">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #1e2a38;
    --panel: #26334a;
    --gold: #ffd700;
    --blue: #4fc3f7;
    --green: #4ade80;
    --mint: #a8e6cf;
    --word-blue: #74b9ff;
    --yellow: #ffe66d;
    --footer: #7f8c8d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: white;
    font-family: "Times New Roman", Georgia, serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .top-left-buttons { display: flex; gap: 6px; }
  .title-stack { text-align: center; flex: 1; }
  .title-stack h1 {
    font-size: 24px;
    color: var(--gold);
    margin: 0;
    letter-spacing: 1px;
  }
  .title-stack .version { font-size: 11px; color: var(--mint); margin-top: 2px; }

  button {
    font-family: inherit;
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    color: white;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-exit { background: #e74c3c; }
  .btn-newgame { background: #3498db; }
  .btn-music { background: #8e44ad; width: 100%; }
  .btn-hint { background: var(--gold); color: #2c3e50; width: 100%; }
  .btn-submit { background: #2ecc71; width: 100%; }
  .btn-clear { background: #95a5a6; width: 100%; }
  .btn-next { background: #2980b9; width: 100%; }
  .btn-instructions {
    background: var(--panel);
    color: var(--mint);
    width: 100%;
    text-align: left;
  }

  .stats-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
  }
  .stats-row .level { color: var(--blue); font-weight: bold; }
  .stats-row .progress { color: var(--mint); }
  .stats-row .score { color: var(--green); font-weight: bold; }

  .word-box {
    background: var(--panel);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: var(--word-blue);
    letter-spacing: 2px;
    word-break: break-all;
  }

  .selection-label { text-align: center; font-size: 13px; color: white; margin-top: 4px; }
  .selection-value {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: var(--gold);
    min-height: 28px;
  }

  .message {
    text-align: center;
    color: var(--yellow);
    font-weight: bold;
    font-size: 14px;
    min-height: 40px;
  }

  .letters-title {
    color: var(--mint);
    font-size: 14px;
    font-weight: bold;
  }
  .letter-grid {
    background: var(--panel);
    border-radius: 8px;
    padding: 10px;
    display: grid;
    gap: 6px;
  }
  .letter-btn {
    background: #3498db;
    aspect-ratio: 1;
    font-size: 18px;
  }
  .letter-btn:disabled { opacity: 0.4; }

  .instructions-content {
    background: var(--panel);
    border-radius: 6px;
    padding: 12px;
    font-size: 13px;
    color: #dfe6e9;
    line-height: 1.6;
    display: none;
  }
  .instructions-content.open { display: block; }

  .footer {
    text-align: center;
    color: var(--footer);
    font-size: 11px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="app">

  <div class="top-bar">
    <div class="top-left-buttons">
      <button class="btn-exit" id="exitBtn">Exit</button>
      <button class="btn-newgame" id="newGameBtn">New Game</button>
    </div>
  </div>
  <div class="title-stack">
    <h1>WORD MASTER</h1>
    <div class="version">Version 1.0</div>
  </div>

  <div class="stats-row">
    <span class="level" id="levelLabel"></span>
    <span class="progress" id="progressLabel"></span>
    <span class="score" id="scoreLabel"></span>
  </div>

  <button class="btn-music" id="musicBtn">🎵 Music OFF</button>

  <div class="word-box" id="wordLabel"></div>

  <button class="btn-hint" id="hintBtn" disabled>💡 Get Hint (locked)</button>

  <div class="selection-label">Your Selection:</div>
  <div class="selection-value" id="selectedLabel"></div>

  <button class="btn-submit" id="submitBtn">Submit Word</button>
  <button class="btn-clear" id="clearBtn">Clear</button>
  <button class="btn-next" id="nextBtn" disabled>Next Word ▶</button>

  <div class="message" id="messageLabel"></div>

  <div class="letters-title">Available Letters</div>
  <div class="letter-grid" id="letterGrid"></div>

  <button class="btn-instructions" id="instructionsToggleBtn">▶ Instructions</button>
  <div class="instructions-content" id="instructionsContent"></div>

  <div class="footer" id="copyrightLabel"></div>

</div>

<audio id="bgMusic" loop>
  <source src="background_music.mp3" type="audio/mpeg">
</audio>

<script>
// ================= CONFIG (same rules as the Windows/Android versions) =================
const LEVEL_WORDS = {
  1: ["CAT","DOG","SUN","RAIN","BIRD","BOOK","TREE","FISH","HOME","CAKE","BALL","STAR"],
  2: ["PYTHON","APPLE","HOUSE","RIVER","MUSIC","BRAIN","CLOUD","DREAM","EARTH","FLAME","GARDEN","HAPPY"],
  3: ["ELEPHANT","KANGAROO","OCTOPUS","RAINBOW","GIRAFFE","MOUNTAIN","OCEAN","PLANET","CASTLE","FOREST","ISLAND"],
  4: ["GALAXY","THUNDER","HORIZON","SATELLITE","ALGORITHM","COMPUTER","DIAMOND","JOURNEY","KNOWLEDGE","LIBERTY"],
  5: ["METEORITE","NEBULA","QUANTUM","ATMOSPHERE","VOLCANO","MYSTERY","ADVENTURE","BEAUTIFUL","CREATIVE","DISCOVER"],
  6: ["FANTASTIC","GENEROUS","HARMONY","IMAGINE","JOURNEY","KINGDOM","LIGHTNING","MAGIC","NATURE","OPPORTUNITY"],
  7: ["PASSION","QUALITY","RADIANT","SUCCESS","TALENT","UNIVERSE","VICTORY","WONDER","EXCELLENT","BRILLIANT"],
  8: ["ACHIEVEMENT","BEAUTY","COURAGE","DREAM","ENERGY","FREEDOM","GLORY","HONOR","INSPIRATION","JOY"],
  9: ["KINDNESS","LEADERSHIP","MIRACLE","NOBLE","OPTIMISM","PEACE","QUEST","RESPECT","STRENGTH","TRIUMPH"],
  10: ["UNITY","VISION","WISDOM","EXPLORER","FRIENDSHIP","GENIUS","HORIZON","INFINITY","JUBILANT","KINGDOM"]
};

const MAX_ATTEMPTS = 3;
const HINT_UNLOCK_ATTEMPT = 2;
const POINTS_NO_HINT = 2;
const POINTS_WITH_HINT = 1;
const DISTRACTOR_COUNT = 4;

// Edit these two to change the footer credit
const COPYRIGHT_YEAR = "2026";
const STUDIO_NAME = "GK studios";

const INSTRUCTIONS_TEXT =
  "• First and last letters are given as a clue — tap the letters to make up the full word.\n" +
  "• You get 3 attempts per word.\n" +
  "• Hint unlocks after 2 wrong attempts (reveals the middle letter).\n" +
  `• No hint = ${POINTS_NO_HINT} pts, with hint = ${POINTS_WITH_HINT} pt.\n` +
  "• Clear all 10 words to advance; miss one and you replay the level.";

// ================= STATE =================
let totalScore = 0;
let currentLevel = 1;
let wordsCompleted = 0;
let currentWord = "";
let attempts = 0;
let hintLevel = 0;
let selectedLetters = [];
let musicOn = false;
let levelFailed = false;
let levelWordList = [];
let instructionsVisible = false;

// ================= ELEMENTS =================
const el = id => document.getElementById(id);
const levelLabel = el("levelLabel");
const progressLabel = el("progressLabel");
const scoreLabel = el("scoreLabel");
const musicBtn = el("musicBtn");
const wordLabel = el("wordLabel");
const hintBtn = el("hintBtn");
const selectedLabel = el("selectedLabel");
const submitBtn = el("submitBtn");
const clearBtn = el("clearBtn");
const nextBtn = el("nextBtn");
const messageLabel = el("messageLabel");
const letterGrid = el("letterGrid");
const instructionsToggleBtn = el("instructionsToggleBtn");
const instructionsContent = el("instructionsContent");
const copyrightLabel = el("copyrightLabel");
const bgMusic = el("bgMusic");

copyrightLabel.textContent = `Copyright ${COPYRIGHT_YEAR} ${STUDIO_NAME}`;
instructionsContent.textContent = INSTRUCTIONS_TEXT;

// ================= SAVE / LOAD PROGRESS =================
function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem("wordmaster_save"));
    if (saved) {
      totalScore = saved.total_score || 0;
      currentLevel = saved.current_level || 1;
    }
  } catch (e) { /* no save yet, start fresh */ }
}
function saveProgress() {
  localStorage.setItem("wordmaster_save", JSON.stringify({
    total_score: totalScore,
    current_level: currentLevel
  }));
}

// ================= MUSIC =================
musicBtn.addEventListener("click", () => {
  musicOn = !musicOn;
  if (musicOn) {
    musicBtn.textContent = "🎵 Music ON";
    bgMusic.play().catch(() => {
      messageLabel.textContent = "Couldn't play background_music.mp3";
      musicOn = false;
      musicBtn.textContent = "🎵 Music OFF";
    });
  } else {
    musicBtn.textContent = "🎵 Music OFF";
    bgMusic.pause();
  }
});

// ================= INSTRUCTIONS =================
instructionsToggleBtn.addEventListener("click", () => {
  instructionsVisible = !instructionsVisible;
  if (instructionsVisible) {
    instructionsContent.classList.add("open");
    instructionsToggleBtn.textContent = "▼ Instructions";
  } else {
    instructionsContent.classList.remove("open");
    instructionsToggleBtn.textContent = "▶ Instructions";
  }
});

// ================= GAME LOGIC =================
function prepareLevelWords() {
  const words = [...new Set((LEVEL_WORDS[currentLevel] || LEVEL_WORDS[10]).map(w => w.toUpperCase()))];
  const shuffled = words.sort(() => Math.random() - 0.5);
  levelWordList = shuffled.slice(0, Math.min(10, shuffled.length));
}

function startNewWord() {
  currentWord = levelWordList[wordsCompleted];
  attempts = 0;
  hintLevel = 0;
  selectedLetters = [];

  hintBtn.disabled = true;
  hintBtn.textContent = "💡 Get Hint (locked)";
  selectedLabel.textContent = "";
  messageLabel.textContent = "";
  submitBtn.disabled = false;
  nextBtn.disabled = true;

  createLetterPool();
  updateWordDisplay();
  updateUi();
}

function createLetterPool() {
  letterGrid.innerHTML = "";

  const correctLetters = currentWord.split("");
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").sort(() => Math.random() - 0.5);
  const distractors = alphabet.slice(0, DISTRACTOR_COUNT);

  const pool = [...correctLetters, ...distractors].sort(() => Math.random() - 0.5);
  const side = Math.ceil(Math.sqrt(pool.length));
  letterGrid.style.gridTemplateColumns = `repeat(${side}, 1fr)`;

  pool.forEach(letter => {
    const btn = document.createElement("button");
    btn.textContent = letter;
    btn.className = "letter-btn";
    btn.addEventListener("click", () => selectLetter(letter));
    letterGrid.appendChild(btn);
  });
}

function selectLetter(letter) {
  selectedLetters.push(letter);
  selectedLabel.textContent = selectedLetters.join("");
}

clearBtn.addEventListener("click", () => {
  selectedLetters = [];
  selectedLabel.textContent = "";
});

function updateWordDisplay() {
  const revealed = new Set([0, currentWord.length - 1]);
  if (hintLevel >= 1) revealed.add(Math.floor(currentWord.length / 2));
  const chars = currentWord.split("").map((c, i) => revealed.has(i) ? c : "_");
  wordLabel.textContent = chars.join(" ");
}

hintBtn.addEventListener("click", () => {
  if (attempts < HINT_UNLOCK_ATTEMPT || hintLevel >= 1) return;
  hintLevel = 1;
  updateWordDisplay();
  hintBtn.disabled = true;
  messageLabel.textContent = `Middle letter revealed! Correct after a hint = ${POINTS_WITH_HINT} pt.`;
});

function setLetterButtonsDisabled(disabled) {
  letterGrid.querySelectorAll("button").forEach(b => b.disabled = disabled);
}

submitBtn.addEventListener("click", () => {
  attempts += 1;
  const guess = selectedLetters.join("").toUpperCase();

  if (guess === currentWord) {
    const points = hintLevel >= 1 ? POINTS_WITH_HINT : POINTS_NO_HINT;
    totalScore += points;
    saveProgress();
    messageLabel.textContent = `🎉 Correct! +${points} point(s)`;
    hintBtn.disabled = true;
    setTimeout(nextWord, 900);
  } else {
    if (attempts >= MAX_ATTEMPTS) {
      levelFailed = true;
      wordLabel.textContent = currentWord;
      messageLabel.textContent = `💀 Out of attempts! The correct word was: ${currentWord}`;
      hintBtn.disabled = true;
      submitBtn.disabled = true;
      setLetterButtonsDisabled(true);
      nextBtn.disabled = false;
    } else {
      messageLabel.textContent = `❌ Wrong! Attempt ${attempts}/${MAX_ATTEMPTS}`;
      selectedLetters = [];
      selectedLabel.textContent = "";
      if (attempts >= HINT_UNLOCK_ATTEMPT && hintLevel === 0) {
        hintBtn.disabled = false;
        hintBtn.textContent = "💡 Get Hint";
      }
    }
  }
});

nextBtn.addEventListener("click", () => {
  nextBtn.disabled = true;
  nextWord();
});

function nextWord() {
  wordsCompleted += 1;
  if (wordsCompleted >= 10) {
    completeLevel();
  } else {
    startNewWord();
  }
}

function completeLevel() {
  if (levelFailed) {
    alert(`Level Not Cleared\n\nYou missed at least one word in Level ${currentLevel}.\nClear all 10 words correctly to advance.\nLet's try this level again!`);
    levelFailed = false;
    wordsCompleted = 0;
    prepareLevelWords();
    startNewWord();
  } else {
    const bonus = 5;
    totalScore += bonus;
    if (currentLevel < 10) {
      alert(`Level Complete!\n\nLevel ${currentLevel} cleared perfectly!\n+${bonus} bonus points\nMoving to the next level!`);
      currentLevel += 1;
    } else {
      alert(`Level 10 Complete!\n\nExcellent! Level 10 mastered!\n+${bonus} bonus points\nReplaying Level 10.`);
    }
    saveProgress();
    wordsCompleted = 0;
    prepareLevelWords();
    startNewWord();
  }
}

function updateUi() {
  levelLabel.textContent = `Level ${currentLevel}`;
  progressLabel.textContent = `Word ${wordsCompleted + 1}/10`;
  scoreLabel.textContent = `Score: ${totalScore}`;
}

// ================= NEW GAME / EXIT =================
el("newGameBtn").addEventListener("click", () => {
  if (confirm("Restart from Level 1?")) {
    currentLevel = 1;
    wordsCompleted = 0;
    totalScore = 0;
    levelFailed = false;
    saveProgress();
    prepareLevelWords();
    startNewWord();
  }
});

el("exitBtn").addEventListener("click", () => {
  if (confirm(`Quit?\nTotal Score: ${totalScore}`)) {
    saveProgress();
    bgMusic.pause();
    window.close();
    // Most mobile browsers block window.close() on tabs they didn't open,
    // so let the player know it's safe to just close the app/tab manually.
    messageLabel.textContent = "You can now close the app.";
  }
});

// ================= INIT =================
loadProgress();
prepareLevelWords();
startNewWord();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
